{% extends "catalog/base.html" %}

{% block title %}Регистрация{% endblock %}

{% block content %}
<h2>Регистрация</h2>
<form method="post" novalidate>
    {% csrf_token %}
    {{ form.as_p }}

</form>
<p>Уже есть аккаунт? <a href="{% url 'users:login' %}">Войти</a></p>
{% endblock %}
